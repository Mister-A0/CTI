<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week 1 - CTI Questions &amp; Exam Mode</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d16;--card:#111827;--hover:#162032;--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.1);--ok:#10b981;--bad:#f43f5e}
[data-theme="light"]{--bg:#f8fafc;--card:#fff;--hover:#f1f5f9;--text:#0f172a;--muted:#475569;--border:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
header{max-width:900px;margin:0 auto;padding:56px 24px 16px;position:relative}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:4px 12px;border-radius:20px;background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
h1{font-size:clamp(26px,6vw,38px);font-weight:800;margin:14px 0 8px;line-height:1.2}
h1 span{background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted)}
.top{position:absolute;top:20px;right:24px;display:flex;gap:8px}
.top button,.top a{width:44px;height:44px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:18px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.modes{max-width:900px;margin:0 auto;padding:8px 24px;display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn.on,.btn.primary{background:#10b981;color:#04130c;border-color:#10b981}
main{max-width:900px;margin:0 auto;padding:8px 24px 56px}
h2.part{font-family:'JetBrains Mono',monospace;font-size:13px;color:#10b981;text-transform:uppercase;letter-spacing:1px;margin:28px 0 10px}
.q{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--c,#10b981);border-radius:16px;padding:20px;margin-bottom:16px}
.mcq{--c:#3b82f6}.tf{--c:#a855f7}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:var(--c);margin-bottom:8px}
.qt{font-weight:600;margin-bottom:12px;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--hover)}
.opt input{margin-top:5px}
.opt.right{border-color:var(--ok);background:rgba(16,185,129,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.15)}
.ans{margin-top:12px;padding:12px 14px;border-left:3px solid var(--ok);background:rgba(16,185,129,.08);border-radius:8px;font-size:14px}
#bar{max-width:900px;margin:0 auto;padding:0 24px 8px}
#result{display:none;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;font-weight:700}
.hide{display:none!important}
.timer{font-family:'JetBrains Mono',monospace;color:var(--muted);align-self:center}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
@media(max-width:600px){header{padding:72px 16px 12px}.modes,main,#bar{padding-left:16px;padding-right:16px}.top{top:16px;right:16px}}
</style>
</head>
<body>
<header>
  <div class="top"><a href="index.html" aria-label="Home">&#8962;</a><button id="theme" aria-label="Toggle theme">&#9788;</button></div>
  <span class="badge">Week 1 &middot; CCY4403</span>
  <h1><span>Week 1</span> Questions</h1>
  <p class="sub">Foundations of CTI. Study Mode shows every question with its answer. Exam Mode quizzes you on all 25 questions with scoring.</p>
</header>
<div class="modes">
  <button class="btn on" id="bStudy">Study Mode</button>
  <button class="btn" id="bExam">Exam Mode</button>
  <span class="timer hide" id="timer"></span>
</div>
<div id="bar"></div>
<main id="app"></main>
<footer>&copy; Zaneso &mdash; Cyber Threat Intelligence Course Notes</footer>
<script>
const D=[{"part": "Part 1 \u00b7 What is CTI", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which statement best distinguishes information from intelligence?", "opts": ["Information is collected by humans; intelligence is collected by machines.", "Information is raw unevaluated data; intelligence is processed and analyzed for a specific decision-maker.", "Information is internal; intelligence is always external.", "Information is free; intelligence is paid."], "ans": 1, "ansText": "Correct: B \u2014 Intelligence = information + analysis + context + consumer. The other options describe source, location, or cost, not the distinction."}, {"part": "Part 1 \u00b7 What is CTI", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "A larger volume of threat data automatically produces better intelligence.", "ans": false, "ansText": "Answer: FALSE \u2014 Volume without processing and analysis produces noise, not intelligence. Quality and relevance matter more than quantity."}, {"part": "Part 1 \u00b7 What is CTI", "n": "Q3", "type": "tf", "label": "Q3 \u00b7 True or False", "tag": "BINARY", "q": "CTI is only useful after an attack has occurred.", "ans": false, "ansText": "Answer: FALSE \u2014 CTI supports proactive defense (threat hunting, patch prioritization, executive briefings) just as much as reactive incident response."}, {"part": "Part 2 \u00b7 CTI Lifecycle", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which phase produces Priority Intelligence Requirements (PIRs)?", "opts": ["Collection", "Direction", "Feedback", "Dissemination"], "ans": 1, "ansText": "Correct: B \u2014 Direction (planning) defines what the organization needs to know; that is what a PIR is."}, {"part": "Part 2 \u00b7 CTI Lifecycle", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "Processing can be performed by machines, humans, or a combination of both.", "ans": true, "ansText": "Answer: TRUE \u2014 Decryption, parsing, and filtering are typically automated; correlation and enrichment usually combine machine processing with human verification."}, {"part": "Part 2 \u00b7 CTI Lifecycle", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "What is the primary output of the Feedback phase?", "opts": ["A new threat feed subscription", "Adjusted PIRs and a refined process, fed back into Direction", "A weekly executive briefing", "A list of IOCs"], "ans": 1, "ansText": "Correct: B \u2014 Feedback evaluates whether goals were met and adjusts priorities, closing the loop back into Direction."}, {"part": "Part 3 \u00b7 Types of CTI", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A CISO requests a quarterly briefing on emerging adversary trends affecting the industry. Which type of CTI is this?", "opts": ["Operational (OTI)", "Strategic (STI)", "Tactical (TTI)", "Technical"], "ans": 1, "ansText": "Correct: B \u2014 Long-term trend analysis for an executive audience is the textbook definition of Strategic Threat Intelligence."}, {"part": "Part 3 \u00b7 Types of CTI", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "Technical CTI (IOCs) typically has the longest lifespan of the four types.", "ans": false, "ansText": "Answer: FALSE \u2014 IOCs rotate fastest because adversaries change IPs, domains, and hashes quickly. Tactical (TTPs) decays slowest."}, {"part": "Part 3 \u00b7 Types of CTI", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which type of CTI is most useful for threat hunting?", "opts": ["Operational (OTI)", "Strategic (STI)", "Tactical (TTI)", "Technical"], "ans": 2, "ansText": "Correct: C \u2014 Tactical intelligence describes attacker TTPs, which hunters use to search for adversary behavior before IOCs appear. Common trap: the wrong answer is often D. IOCs are reactive (post-compromise); TTPs enable proactive hunting."}, {"part": "Part 4 \u00b7 CTI Tools", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which feature requires a CTI tool to scan external feeds worldwide, not just internal logs?", "opts": ["Data-driven", "Externally focused", "Comprehensive", "Extensible"], "ans": 2, "ansText": "Correct: C \u2014 Comprehensive = scanning volumes of external feeds covering threat information from all over the world. 'Externally focused' is about direction (outward vs. inward); 'comprehensive' is about breadth."}, {"part": "Part 4 \u00b7 CTI Tools", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "Cisco Umbrella is an example of a DNS-layer CTI tool.", "ans": true, "ansText": "Answer: TRUE \u2014 Cisco Umbrella blocks malicious domains at the DNS layer before connections reach corporate endpoints."}, {"part": "Part 4 \u00b7 CTI Tools", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A tool that fuses multiple internal and external feeds into a single normalized stream is best described as:", "opts": ["DNS-layer protection (Cisco Umbrella)", "Internet noise intelligence (GreyNoise)", "Multi-source threat fusion (ThreatFusion)", "OSINT / dark web monitoring (Echosec)"], "ans": 2, "ansText": "Correct: C \u2014 ThreatFusion is categorized as multi-source threat fusion, combining feeds into one normalized stream."}, {"part": "Part 5 \u00b7 Why CTI Matters", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A CISO uses CTI briefings to justify a $500K budget increase for threat hunting. Which benefit of CTI does this most directly illustrate?", "opts": ["Reduces risk of cyber attacks", "Increases staff efficiency", "Prevents financial loss", "Supports security-informed decision-making"], "ans": 3, "ansText": "Correct: D \u2014 The CISO uses intelligence to make a defensible resource-allocation decision, the definition of security-informed decision-making."}, {"part": "Part 5 \u00b7 Why CTI Matters", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "CTI increases staff efficiency by reducing the time analysts spend on false positives and re-investigating known threats.", "ans": true, "ansText": "Answer: TRUE \u2014 By prioritizing and enriching alerts, CTI lets analysts focus on genuine threats."}, {"part": "Part 5 \u00b7 Why CTI Matters", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "In the healthcare mini-case, which CTI types were combined to stop the ransomware reconnaissance?", "opts": ["Only Strategic (STI)", "Only Technical (IOCs)", "Operational + Tactical + Technical together", "None; the hospital used only internal logs"], "ans": 2, "ansText": "Correct: C \u2014 OTI alerted IR, TTI briefed hunters on affiliate TTPs, and Technical IOCs were pushed to EDR. Takeaway: no single CTI type is sufficient for high-stakes defense."}, {"part": "Cumulative Assessment", "n": "MCQ 1", "type": "mcq", "label": "MCQ 1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which phase of the lifecycle produces Priority Intelligence Requirements (PIRs)?", "opts": ["Collection", "Direction", "Processing", "Dissemination"], "ans": 1, "ansText": "Correct: B \u2014 Direction is the planning phase where PIRs are defined."}, {"part": "Cumulative Assessment", "n": "MCQ 2", "type": "mcq", "label": "MCQ 2 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A weekly briefing on emerging adversary trends, consumed by the CISO, is best classified as:", "opts": ["Operational", "Strategic", "Tactical", "Technical"], "ans": 1, "ansText": "Correct: B \u2014 Long-term trend intel for an executive audience = Strategic."}, {"part": "Cumulative Assessment", "n": "MCQ 3", "type": "mcq", "label": "MCQ 3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which is NOT one of the five key features of an effective CTI tool?", "opts": ["Data-driven", "Externally focused", "Self-contained", "Comprehensive"], "ans": 2, "ansText": "Correct: C \u2014 The five features are data-driven, externally focused, flexible, comprehensive, extensible. 'Self-contained' is the opposite of extensible."}, {"part": "Cumulative Assessment", "n": "MCQ 4", "type": "mcq", "label": "MCQ 4 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "In the residual-risk formula R = L \u00d7 I \u00d7 E \u00d7 (1 \u2212 C_e), what does (1 \u2212 C_e) represent?", "opts": ["The probability the control fails", "The likelihood of attack", "The exposure factor", "The asset impact"], "ans": 0, "ansText": "Correct: A \u2014 (1 \u2212 C_e) is the residual vulnerability after controls; equivalently, the probability the existing controls fail to stop an attack."}, {"part": "Cumulative Assessment", "n": "MCQ 5", "type": "mcq", "label": "MCQ 5 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A fusion policy that alerts only when BOTH feeds fire (logical AND) will:", "opts": ["Raise TPR and raise FPR", "Lower TPR and lower FPR", "Raise TPR and lower FPR", "Have no effect on either"], "ans": 1, "ansText": "Correct: B \u2014 AND-fusion multiplies probabilities, so both TPR and FPR decrease."}, {"part": "Cumulative Assessment", "n": "T/F 1", "type": "tf", "label": "T/F 1 \u00b7 True or False", "tag": "BINARY", "q": "Information and intelligence are interchangeable terms in CTI.", "ans": false, "ansText": "Answer: FALSE \u2014 Information is raw data; intelligence is processed, analyzed, and contextualized."}, {"part": "Cumulative Assessment", "n": "T/F 2", "type": "tf", "label": "T/F 2 \u00b7 True or False", "tag": "BINARY", "q": "The Feedback phase is optional in mature CTI programs.", "ans": false, "ansText": "Answer: FALSE \u2014 Feedback makes the lifecycle cyclical; skipping it converts the program into a one-shot pipeline."}, {"part": "Cumulative Assessment", "n": "T/F 3", "type": "tf", "label": "T/F 3 \u00b7 True or False", "tag": "BINARY", "q": "Technical CTI is usually paired with Operational CTI because both focus on real-time or short-lifespan indicators.", "ans": true, "ansText": "Answer: TRUE \u2014 Technical CTI is often paired with OTI for active threats; both decay quickly."}, {"part": "Cumulative Assessment", "n": "T/F 4", "type": "tf", "label": "T/F 4 \u00b7 True or False", "tag": "BINARY", "q": "Majority voting among three independent analysts always lowers accuracy compared with a single best analyst.", "ans": false, "ansText": "Answer: FALSE \u2014 With three 80%-accurate analysts voting independently, team accuracy rises to 89.6% (Scenario 4)."}, {"part": "Cumulative Assessment", "n": "T/F 5", "type": "tf", "label": "T/F 5 \u00b7 True or False", "tag": "BINARY", "q": "A 25% per-quarter reduction in miss rate produces a 100% reduction after 4 cycles.", "ans": false, "ansText": "Answer: FALSE \u2014 Geometric decay: 0.40 \u00d7 0.75^4 \u2248 12.66%, not 0% (Scenario 5)."}];
const r=document.documentElement,s=localStorage.getItem('theme');
if(s)r.setAttribute('data-theme',s);
document.getElementById('theme').onclick=()=>{const n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);localStorage.setItem('theme',n)};
const app=document.getElementById('app'),bar=document.getElementById('bar'),timer=document.getElementById('timer');
const L='ABCD';let tick=null;
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function head(q){return `<div class="meta"><span>${esc(q.label)}</span><span>${esc(q.tag)}</span></div><div class="qt">${esc(q.q)}</div>`}
function study(){
  clearInterval(tick);timer.classList.add('hide');bar.innerHTML='';
  let h='',part='';
  D.forEach(q=>{
    if(q.part!==part){part=q.part;h+=`<h2 class="part">${esc(part)}</h2>`}
    h+=`<div class="q ${q.type}">${head(q)}`;
    if(q.type==='mcq')h+=q.opts.map((o,i)=>`<div class="opt ${i===q.ans?'right':''}"><b>${L[i]}.</b><span>${esc(o)}</span></div>`).join('');
    h+=`<div class="ans">${esc(q.ansText)}</div></div>`;
  });
  app.innerHTML=h;
}
let ex=[];
function exam(){
  clearInterval(tick);
  ex=D;bar.innerHTML='';
  let h=`<div id="result"></div>`;
  ex.forEach((q,k)=>{
    h+=`<div class="q ${q.type}" id="e${k}"><div class="meta"><span>Question ${k+1} of ${ex.length}</span><span>${q.type==='mcq'?'Multiple Choice':'True or False'}</span></div><div class="qt">${esc(q.q)}</div>`;
    const opts=q.type==='mcq'?q.opts.map((o,i)=>[i,L[i]+'. '+o]):[[1,'True'],[0,'False']];
    h+=opts.map(([v,t])=>`<label class="opt"><input type="radio" name="q${k}" value="${v}"><span>${esc(t)}</span></label>`).join('');
    h+=`<div class="ans hide"></div></div>`;
  });
  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="sub">Submit Exam</button><button class="btn" id="rst">Restart</button></div>`;
  app.innerHTML=h;
  let t=0;timer.classList.remove('hide');timer.textContent='00:00';
  tick=setInterval(()=>{t++;timer.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);
  document.getElementById('rst').onclick=exam;
  document.getElementById('sub').onclick=()=>{
    clearInterval(tick);let sc=0;
    ex.forEach((q,k)=>{
      const box=document.getElementById('e'+k);
      const c=box.querySelector('input:checked');
      const correct=q.type==='mcq'?q.ans:(q.ans?1:0);
      const val=c?+c.value:null;
      if(val===correct)sc++;
      box.querySelectorAll('label.opt').forEach(l=>{
        const v=+l.querySelector('input').value;
        if(v===correct)l.classList.add('right');
        else if(v===val)l.classList.add('wrong');
        l.querySelector('input').disabled=true;
      });
      const a=box.querySelector('.ans');a.classList.remove('hide');
      a.innerHTML=(val===null?'<b>Not answered.</b> ':val===correct?'<b>Correct.</b> ':'<b>Incorrect.</b> ')+esc(q.ansText);
    });
    const res=document.getElementById('result');
    res.style.display='block';
    res.textContent=`Score: ${sc} / ${ex.length} (${Math.round(sc/ex.length*100)}%) · Time ${timer.textContent}`;
    document.getElementById('sub').disabled=true;
    window.scrollTo({top:0,behavior:'smooth'});
  };
}
const bS=document.getElementById('bStudy'),bE=document.getElementById('bExam');
bS.onclick=()=>{bS.classList.add('on');bE.classList.remove('on');study()};
bE.onclick=()=>{bE.classList.add('on');bS.classList.remove('on');exam()};
study();
</script>
</body>
</html>
