<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week 3 - CTI Questions &amp; Exam Mode</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d16;--card:#111827;--hover:#162032;--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.1);--ok:#10b981;--bad:#f43f5e}
[data-theme="light"]{--bg:#f8fafc;--card:#fff;--hover:#f1f5f9;--text:#0f172a;--muted:#475569;--border:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
header{max-width:900px;margin:0 auto;padding:56px 24px 16px;position:relative}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:4px 12px;border-radius:20px;background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
h1{font-size:clamp(26px,6vw,38px);font-weight:800;margin:14px 0 8px;line-height:1.2}
h1 span{background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted)}
.top{position:absolute;top:20px;right:24px;display:flex;gap:8px}
.top button,.top a{width:44px;height:44px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:18px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.modes{max-width:900px;margin:0 auto;padding:8px 24px;display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn.on,.btn.primary{background:#10b981;color:#04130c;border-color:#10b981}
main{max-width:900px;margin:0 auto;padding:8px 24px 56px}
h2.part{font-family:'JetBrains Mono',monospace;font-size:13px;color:#10b981;text-transform:uppercase;letter-spacing:1px;margin:28px 0 10px}
.q{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--c,#10b981);border-radius:16px;padding:20px;margin-bottom:16px}
.mcq{--c:#3b82f6}.tf{--c:#a855f7}.sa{--c:#f59e0b}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:var(--c);margin-bottom:8px}
.qt{font-weight:600;margin-bottom:12px;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--hover)}
.opt input{margin-top:5px}
.opt.right{border-color:var(--ok);background:rgba(16,185,129,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.15)}
.ans{margin-top:12px;padding:12px 14px;border-left:3px solid var(--ok);background:rgba(16,185,129,.08);border-radius:8px;font-size:14px;white-space:pre-line}
#bar{max-width:900px;margin:0 auto;padding:0 24px 8px}
#result{display:none;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;font-weight:700}
.hide{display:none!important}
.timer{font-family:'JetBrains Mono',monospace;color:var(--muted);align-self:center}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
@media(max-width:600px){header{padding:72px 16px 12px}.modes,main,#bar{padding-left:16px;padding-right:16px}.top{top:16px;right:16px}}
</style>
</head>
<body>
<header>
  <div class="top"><a href="index.html" aria-label="Home">&#8962;</a><button id="theme" aria-label="Toggle theme">&#9788;</button></div>
  <span class="badge">Week 3 &middot; CCY4403</span>
  <h1><span>Week 3</span> Questions</h1>
  <p class="sub">Threat Actor Profiling &amp; Threat Landscape. Study Mode shows every question with its answer. Exam Mode quizzes you on the MCQ and True/False questions.</p>
</header>
<div class="modes">
  <button class="btn on" id="bStudy">Study Mode</button>
  <button class="btn" id="bExam">Exam Mode (MCQ + T/F)</button>
  <span class="timer hide" id="timer"></span>
</div>
<div id="bar"></div>
<main id="app"></main>
<footer>&copy; Zaneso &mdash; Cyber Threat Intelligence Course Notes</footer>
<script>
const D=[{"part": "Part 1 \u00b7 Why Profile Threat Actors", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Threat actor profiling primarily answers which question from the Diamond Model?", "opts": ["What infrastructure was used?", "Who is the adversary?", "What capability was deployed?", "Who is the victim?"], "ans": 1, "ansText": "Correct: B \u2014 Profiling populates the Adversary vertex; infrastructure and capability are separate vertices. Trap: conflating profiling with IOC collection."}, {"part": "Part 1 \u00b7 Why Profile Threat Actors", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "Threat actor profiling is the same discipline as malware analysis.", "ans": false, "ansText": "Answer: FALSE \u2014 Malware analysis (a Week 6 topic) examines artefacts; profiling examines the human adversary behind them. Malware reuse is ONE input to profiling."}, {"part": "Part 1 \u00b7 Why Profile Threat Actors", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "How does profiling connect to the CTI Lifecycle's Direction phase?", "opts": ["It replaces the Direction phase.", "It is performed after Collection.", "It shapes Priority Intelligence Requirements by identifying likely adversaries.", "It is unrelated to Direction."], "ans": 2, "ansText": "Correct: C \u2014 Understanding likely adversaries informs which PIRs matter, the core output of Direction. Direction sets PIRs first; profiling feeds it."}, {"part": "Part 2 \u00b7 Four Actor Categories", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which threat actor category is BEST characterised by short-term, opportunistic 'smash and grab' operations funded by the crime itself?", "opts": ["Nation-state / APT", "Cybercriminal", "Hacktivist", "Insider"], "ans": 1, "ansText": "Correct: B \u2014 Cybercriminals are financially motivated, self-funded via crime, and typically run short opportunistic campaigns. The differentiator is motive + monetisation model, not skill."}, {"part": "Part 2 \u00b7 Four Actor Categories", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "'APT' and 'nation-state' are interchangeable terms meaning the same thing.", "ans": false, "ansText": "Answer: FALSE \u2014 APT describes a behavioural pattern; nation-state describes sponsorship. Most APTs are state-linked, but the terms are not synonyms."}, {"part": "Part 2 \u00b7 Four Actor Categories", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Why do insider threats bypass most external-facing defences?", "opts": ["They use zero-day exploits.", "They operate from inside the trust boundary using legitimate credentials.", "They always have state sponsorship.", "They use supply-chain compromise."], "ans": 1, "ansText": "Correct: B \u2014 Firewalls, email security, and EDR are designed for inbound threats; insiders already hold legitimate access. Insiders do not need exploits; the differentiator is intent."}, {"part": "Part 3 \u00b7 MITRE ATT&CK Group Pages", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "On a MITRE ATT&CK Group page, what does the 'Associated Groups' field represent?", "opts": ["Subgroups of the actor", "Aliases from different vendors for the same activity cluster", "Co-victims of the actor", "Sponsor organisations"], "ans": 1, "ansText": "Correct: B \u2014 Vendors independently name clusters; MITRE reconciles these aliases under one G-number. It does NOT mean subordinate teams."}, {"part": "Part 3 \u00b7 MITRE ATT&CK Group Pages", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "The G-number assigned by MITRE (e.g., G0006) is the same identifier used by all vendors in their reports.", "ans": false, "ansText": "Answer: FALSE \u2014 Vendors use their own naming; the G-number is MITRE's canonical, vendor-neutral identifier."}, {"part": "Part 3 \u00b7 MITRE ATT&CK Group Pages", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which section of a MITRE Group page would you consult to map the actor's behaviour across the kill chain?", "opts": ["Associated Groups", "Description", "Techniques (grouped by tactic)", "References"], "ans": 2, "ansText": "Correct: C \u2014 The Techniques section maps observed behaviours to ATT&CK tactic IDs from Initial Access through Impact. The Description is narrative context only."}, {"part": "Part 4 \u00b7 Attribution Confidence", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Why is attribution confidence typically expressed as low / moderate / high rather than yes / no?", "opts": ["Because vendors prefer vague language.", "Because attribution is a graded judgment under uncertainty, accumulated from multiple evidence sources.", "Because the law requires it.", "Because high confidence is impossible."], "ans": 1, "ansText": "Correct: B \u2014 Attribution accumulates evidence; graded confidence shows how strong it is. 'Low confidence' does not mean 'wrong', only that the evidence base is thin."}, {"part": "Part 4 \u00b7 Attribution Confidence", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "A single reused malware sample is sufficient for high-confidence public attribution.", "ans": false, "ansText": "Answer: FALSE \u2014 High confidence requires multi-source corroboration across technical, behavioural, and contextual evidence. Single-source indicators are LOW confidence by default."}, {"part": "Part 4 \u00b7 Attribution Confidence", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which combination of evidence classes best supports HIGH-confidence attribution?", "opts": ["Technical only", "Behavioural only", "Contextual only", "Technical + behavioural + contextual, multi-source"], "ans": 3, "ansText": "Correct: D \u2014 Multi-factor attribution across all three classes is the standard for high confidence; relying on one class leaves you exposed to false flags."}, {"part": "Part 5 \u00b7 False Flags", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "What is a false flag in cyber attribution?", "opts": ["An accidental misattribution caused by analyst error.", "A deliberate attempt to mislead investigators into attributing an operation to the wrong party by mimicking another actor.", "A type of malware.", "A vendor naming convention."], "ans": 1, "ansText": "Correct: B \u2014 False flags are deliberate misdirection: the attacker plants evidence pointing at a scapegoat. Accidental misattribution is a separate problem."}, {"part": "Part 5 \u00b7 False Flags", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "Behavioural patterns (TTPs) are easier for an attacker to fake consistently across many campaigns than technical indicators like malware hashes.", "ans": false, "ansText": "Answer: FALSE \u2014 Behaviour reflects operational habits and is HARDER to fake consistently than reusing a tool or domain (Pyramid of Pain: TTPs at the top)."}, {"part": "Part 5 \u00b7 False Flags", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which countermeasure MOST directly raises the cost of planting a convincing false flag?", "opts": ["Relying on a single malware hash.", "Multi-source correlation across independent data feeds.", "Naming the actor before analysing.", "Using only one vendor report."], "ans": 1, "ansText": "Correct: B \u2014 A false flag planted to fool ONE source is less likely to stay consistent across ALL independent sources."}, {"part": "Review Questions", "n": "Review Q1", "type": "sa", "label": "Review Q1 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Why is threat actor profiling considered a distinct discipline that sits ON TOP of the Week 2 frameworks rather than alongside them?", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q2", "type": "sa", "label": "Review Q2 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Compare nation-state and cybercriminal actors across motivation, funding, persistence, and at least two TTPs each.", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q3", "type": "sa", "label": "Review Q3 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Explain the nuance that \"APT\" and \"nation-state\" are not synonyms. Give a concrete illustrative example.", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q4", "type": "sa", "label": "Review Q4 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Describe the structure of a MITRE ATT&CK Group page and the role of each major field.", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q5", "type": "sa", "label": "Review Q5 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Why does the same threat actor often appear under multiple names across different vendor reports?", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q6", "type": "sa", "label": "Review Q6 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Explain the concept of attribution confidence. Why is it expressed in graded rather than binary terms?", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q7", "type": "sa", "label": "Review Q7 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "List the three evidence classes that contribute to attribution confidence and give one example of each.", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q8", "type": "sa", "label": "Review Q8 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Define a false-flag operation. Why do attackers bother planting false flags?", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q9", "type": "sa", "label": "Review Q9 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Describe two countermeasures against false flags and connect each to a concept from earlier in the course.", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Review Questions", "n": "Review Q10", "type": "sa", "label": "Review Q10 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Walk through the 5 steps of building an actor card from a MITRE Group page.", "ansText": "No model answer is given in the PDF (to be discussed in tutorial). Check the Week 3 summary notes."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 1", "type": "mcq", "label": "MCQ 1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which actor category is BEST characterised by ideological motivation and campaign-based persistence?", "opts": ["Nation-state", "Cybercriminal", "Hacktivist", "Insider"], "ans": 2, "ansText": "Correct: C \u2014 Hacktivists are ideologically motivated and run campaign-based operations."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 2", "type": "mcq", "label": "MCQ 2 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "The MITRE G-number primarily serves as:", "opts": ["A vendor name", "A stable, vendor-neutral identifier", "A malware family ID", "A list"], "ans": 1, "ansText": "Correct: B \u2014 It is MITRE's canonical, vendor-neutral identifier."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 3", "type": "mcq", "label": "MCQ 3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "'High confidence' attribution typically requires:", "opts": ["One reused malware hash", "Multi-source technical + behavioural + contextual evidence", "A single vendor report", "Geopolitical timing alone"], "ans": 1, "ansText": "Correct: B \u2014 High confidence needs multi-source corroboration across all three evidence classes."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 4", "type": "mcq", "label": "MCQ 4 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which is the strongest false-flag countermeasure?", "opts": ["Relying on hashes", "Single-source analysis", "Multi-source correlation", "Naming first, analysing later"], "ans": 2, "ansText": "Correct: C \u2014 Multi-source correlation makes a planted false flag hard to keep consistent."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 5", "type": "mcq", "label": "MCQ 5 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "The 'Associated Groups' field on a MITRE Group page lists:", "opts": ["Subgroups", "Vendor aliases for the same cluster", "Co-victims", "Sponsors"], "ans": 1, "ansText": "Correct: B \u2014 It is the alias reconciliation list."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 1", "type": "tf", "label": "T/F 1 \u00b7 True or False", "tag": "BINARY", "q": "APT and nation-state are interchangeable terms.", "ans": false, "ansText": "Answer: FALSE \u2014 APT is a behavioural pattern; nation-state is sponsorship."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 2", "type": "tf", "label": "T/F 2 \u00b7 True or False", "tag": "BINARY", "q": "Attribution is a graded judgment, not a binary one.", "ans": true, "ansText": "Answer: TRUE \u2014 Confidence is expressed as low / moderate / high."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 3", "type": "tf", "label": "T/F 3 \u00b7 True or False", "tag": "BINARY", "q": "Insider threats typically bypass most external-facing defences because they hold legitimate access.", "ans": true, "ansText": "Answer: TRUE \u2014 They operate inside the trust boundary with legitimate credentials."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 4", "type": "tf", "label": "T/F 4 \u00b7 True or False", "tag": "BINARY", "q": "A single reused malware sample is sufficient for high-confidence public attribution.", "ans": false, "ansText": "Answer: FALSE \u2014 Single-source indicators are low confidence by default."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 5", "type": "tf", "label": "T/F 5 \u00b7 True or False", "tag": "BINARY", "q": "Behavioural patterns are EASIER for an attacker to fake consistently than technical indicators.", "ans": false, "ansText": "Answer: FALSE \u2014 TTPs are harder to fake and change than hashes or domains."}];
const r=document.documentElement,s=localStorage.getItem('theme');
if(s)r.setAttribute('data-theme',s);
document.getElementById('theme').onclick=()=>{const n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);localStorage.setItem('theme',n)};
const app=document.getElementById('app'),bar=document.getElementById('bar'),timer=document.getElementById('timer');
const L='ABCD';let tick=null;
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function head(q){return `<div class="meta"><span>${esc(q.label)}</span><span>${esc(q.tag)}</span></div><div class="qt">${esc(q.q)}</div>`}
function study(){
  clearInterval(tick);timer.classList.add('hide');bar.innerHTML='';
  let h='',part='';
  D.forEach(q=>{
    if(q.part!==part){part=q.part;h+=`<h2 class="part">${esc(part)}</h2>`}
    h+=`<div class="q ${q.type}">${head(q)}`;
    if(q.type==='mcq')h+=q.opts.map((o,i)=>`<div class="opt ${i===q.ans?'right':''}"><b>${L[i]}.</b><span>${esc(o)}</span></div>`).join('');
    h+=`<div class="ans">${esc(q.ansText)}</div></div>`;
  });
  app.innerHTML=h;
}
let ex=[];
function exam(){
  clearInterval(tick);
  ex=D.filter(q=>q.type==='mcq'||q.type==='tf');bar.innerHTML='';
  let h=`<div id="result"></div>`;
  ex.forEach((q,k)=>{
    h+=`<div class="q ${q.type}" id="e${k}"><div class="meta"><span>Question ${k+1} of ${ex.length}</span><span>${q.type==='mcq'?'Multiple Choice':'True or False'}</span></div><div class="qt">${esc(q.q)}</div>`;
    const opts=q.type==='mcq'?q.opts.map((o,i)=>[i,L[i]+'. '+o]):[[1,'True'],[0,'False']];
    h+=opts.map(([v,t])=>`<label class="opt"><input type="radio" name="q${k}" value="${v}"><span>${esc(t)}</span></label>`).join('');
    h+=`<div class="ans hide"></div></div>`;
  });
  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="sub">Submit Exam</button><button class="btn" id="rst">Restart</button></div>`;
  app.innerHTML=h;
  let t=0;timer.classList.remove('hide');timer.textContent='00:00';
  tick=setInterval(()=>{t++;timer.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);
  document.getElementById('rst').onclick=exam;
  document.getElementById('sub').onclick=()=>{
    clearInterval(tick);let sc=0;
    ex.forEach((q,k)=>{
      const box=document.getElementById('e'+k);
      const c=box.querySelector('input:checked');
      const correct=q.type==='mcq'?q.ans:(q.ans?1:0);
      const val=c?+c.value:null;
      if(val===correct)sc++;
      box.querySelectorAll('label.opt').forEach(l=>{
        const v=+l.querySelector('input').value;
        if(v===correct)l.classList.add('right');
        else if(v===val)l.classList.add('wrong');
        l.querySelector('input').disabled=true;
      });
      const a=box.querySelector('.ans');a.classList.remove('hide');
      a.innerHTML=(val===null?'<b>Not answered.</b> ':val===correct?'<b>Correct.</b> ':'<b>Incorrect.</b> ')+esc(q.ansText);
    });
    const res=document.getElementById('result');
    res.style.display='block';
    res.textContent=`Score: ${sc} / ${ex.length} (${Math.round(sc/ex.length*100)}%) · Time ${timer.textContent}`;
    document.getElementById('sub').disabled=true;
    window.scrollTo({top:0,behavior:'smooth'});
  };
}
const bS=document.getElementById('bStudy'),bE=document.getElementById('bExam');
bS.onclick=()=>{bS.classList.add('on');bE.classList.remove('on');study()};
bE.onclick=()=>{bE.classList.add('on');bS.classList.remove('on');exam()};
study();
</script>
</body>
</html>
