<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Week 5 - CTI Questions &amp; Exam Mode</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#090d16;--card:#111827;--hover:#162032;--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.1);--ok:#10b981;--bad:#f43f5e}
[data-theme="light"]{--bg:#f8fafc;--card:#fff;--hover:#f1f5f9;--text:#0f172a;--muted:#475569;--border:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
header{max-width:900px;margin:0 auto;padding:56px 24px 16px;position:relative}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:4px 12px;border-radius:20px;background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
h1{font-size:clamp(26px,6vw,38px);font-weight:800;margin:14px 0 8px;line-height:1.2}
h1 span{background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted)}
.top{position:absolute;top:20px;right:24px;display:flex;gap:8px}
.top button,.top a{width:44px;height:44px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:18px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.modes{max-width:900px;margin:0 auto;padding:8px 24px;display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn.on,.btn.primary{background:#10b981;color:#04130c;border-color:#10b981}
main{max-width:900px;margin:0 auto;padding:8px 24px 56px}
h2.part{font-family:'JetBrains Mono',monospace;font-size:13px;color:#10b981;text-transform:uppercase;letter-spacing:1px;margin:28px 0 10px}
.q{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--c,#10b981);border-radius:16px;padding:20px;margin-bottom:16px}
.mcq{--c:#3b82f6}.tf{--c:#a855f7}.sa{--c:#f59e0b}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:var(--c);margin-bottom:8px}
.qt{font-weight:600;margin-bottom:12px;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--hover)}
.opt input{margin-top:5px}
.opt.right{border-color:var(--ok);background:rgba(16,185,129,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.15)}
.ans{margin-top:12px;padding:12px 14px;border-left:3px solid var(--ok);background:rgba(16,185,129,.08);border-radius:8px;font-size:14px;white-space:pre-line}
#bar{max-width:900px;margin:0 auto;padding:0 24px 8px}
#result{display:none;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;font-weight:700}
.hide{display:none!important}
.timer{font-family:'JetBrains Mono',monospace;color:var(--muted);align-self:center}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
@media(max-width:600px){header{padding:72px 16px 12px}.modes,main,#bar{padding-left:16px;padding-right:16px}.top{top:16px;right:16px}}
</style>
</head>
<body>
<header>
  <div class="top"><a href="index.html" aria-label="Home">&#8962;</a><button id="theme" aria-label="Toggle theme">&#9788;</button></div>
  <span class="badge">Week 5 &middot; CCY4403</span>
  <h1><span>Week 5</span> Questions</h1>
  <p class="sub">Threat Indicators &amp; Data Enrichment. Study Mode shows every question with its answer. Exam Mode quizzes you on the MCQ and True/False questions.</p>
</header>
<div class="modes">
  <button class="btn on" id="bStudy">Study Mode</button>
  <button class="btn" id="bExam">Exam Mode (MCQ + T/F)</button>
  <span class="timer hide" id="timer"></span>
</div>
<div id="bar"></div>
<main id="app"></main>
<footer>&copy; Zaneso &mdash; Cyber Threat Intelligence Course Notes</footer>
<script>
const D=[{"part": "Part 1 \u00b7 Introduction", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which statement best describes the role of data enrichment in cyber threat intelligence?", "opts": ["It replaces threat indicators by providing direct attacker attribution.", "It adds context (geolocation, WHOIS, reputation, actor profiles) that turns a bare indicator into meaningful intelligence.", "It is the same as collecting raw logs from firewalls and SIEMs.", "It only matters during the post-incident report writing phase."], "ans": 1, "ansText": "Correct: B \u2014 Enrichment adds context to existing indicators so analysts can prioritize and respond accurately. Trap: option A; enrichment does not perform attribution on its own."}, {"part": "Part 1 \u00b7 Introduction", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "This week re-teaches Week 4's Level 1 Threat Indicators in full so students can review them from scratch.", "ans": false, "ansText": "Answer: FALSE \u2014 The deck only references Week 4 as a connector; full re-exposition is out of scope. Week 4 is a prerequisite, not a re-teach target."}, {"part": "Part 1 \u00b7 Introduction", "n": "Q3", "type": "tf", "label": "Q3 \u00b7 True or False", "tag": "BINARY", "q": "Malware analysis technique is introduced this week as part of indicator classification.", "ans": false, "ansText": "Answer: FALSE \u2014 Malware analysis is reserved for Week 6. Taxonomy classifies observable data, not analysis techniques."}, {"part": "Part 2 \u00b7 Threat Indicators", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which of the following is a COMPUTED indicator?", "opts": ["A suspicious IP address (185.220.101.47)", "An email sender display name ('IT Helpdesk')", "The SHA-256 hash of a dropped binary", "A series of failed login attempts followed by a successful one from a new country"], "ans": 2, "ansText": "Correct: C \u2014 A SHA-256 hash is derived from a file via a cryptographic operation, the definition of a computed indicator. Option D is behavioral: a sequence, not a single data point."}, {"part": "Part 2 \u00b7 Threat Indicators", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "Atomic indicators are the easiest for adversaries to rotate, which is why they sit low on the Pyramid of Pain (Week 2 connector).", "ans": true, "ansText": "Answer: TRUE \u2014 Atomic indicators like IPs and domains are cheap to replace, so they cause the least pain when blocked. Detection ease \u2260 adversary pain."}, {"part": "Part 2 \u00b7 Threat Indicators", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A behavioral indicator is BEST described as:", "opts": ["A single suspicious log line", "A cryptographic fingerprint of a file", "A sequence of actions that, in combination, indicates attacker behavior", "A geolocation tag added to an IP"], "ans": 2, "ansText": "Correct: C \u2014 Behavioral indicators capture sequences or patterns of actions, not isolated data points. A single log line is atomic even if it looks suspicious."}, {"part": "Part 3 \u00b7 IoC Lifecycle", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "In the IoC lifecycle, which stage feeds raw forensic clues (logs, memory captures, file artifacts) into monitoring tools to detect anomalies?", "opts": ["Analyze", "Deploy", "Collect", "Monitor"], "ans": 2, "ansText": "Correct: C \u2014 Collect is the first stage, where raw forensic data is gathered; Monitor uses that data to detect anomalies. A very common mistake is answering Monitor."}, {"part": "Part 3 \u00b7 IoC Lifecycle", "n": "Q2", "type": "mcq", "label": "Q2 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which stage produces REFINED IoCs ready to be deployed into security controls?", "opts": ["Collect", "Monitor", "Analyze", "Deploy"], "ans": 2, "ansText": "Correct: C \u2014 Analyze is where raw findings are contextualized and turned into actionable network-based and host-based IoCs."}, {"part": "Part 3 \u00b7 IoC Lifecycle", "n": "Q3", "type": "tf", "label": "Q3 \u00b7 True or False", "tag": "BINARY", "q": "The IoC lifecycle is strictly linear: once an IoC is deployed, the lifecycle ends and the indicator is never revisited.", "ans": false, "ansText": "Answer: FALSE \u2014 The lifecycle is iterative; deployed detections generate new forensic clues that feed back into Collect."}, {"part": "Part 4 \u00b7 Data Enrichment", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which of the following is NOT a common data enrichment source?", "opts": ["Passive DNS database", "WHOIS lookup service", "Malware sandbox report", "The raw firewall log itself"], "ans": 3, "ansText": "Correct: D \u2014 The raw firewall log is the input being enriched, the SUBJECT of enrichment, not a SOURCE of context."}, {"part": "Part 4 \u00b7 Data Enrichment", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "One of the primary benefits of data enrichment is reducing alert fatigue by helping analysts distinguish real threats from benign or low-risk events.", "ans": true, "ansText": "Answer: TRUE \u2014 Reducing alert fatigue is one of the four canonical benefits (correlation, alert fatigue, investigation time, incident response)."}, {"part": "Part 4 \u00b7 Data Enrichment", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "In the firewall-log worked example, which enrichment field MOST directly supports the decision to escalate to incident response?", "opts": ["The destination port (4444)", "The reputation score of 92/100 from three independent feeds, plus APT29 campaign association", "The byte count (2048)", "The protocol (TCP)"], "ans": 1, "ansText": "Correct: B \u2014 Reputation + campaign association turns a dropped packet into a high-confidence escalation. Port 4444 is suspicious but not actionable without the enrichment layer."}, {"part": "Part 5 \u00b7 IOC vs IOA vs IOF", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A suspicious PowerShell command line observed in EDR in real time is BEST classified as which indicator type?", "opts": ["IOC", "IOA", "IOF", "None of the above"], "ans": 1, "ansText": "Correct: B \u2014 A live behavioral observation during an intrusion is an IOA: it captures what the attacker is doing now. IOC implies the breach has already happened."}, {"part": "Part 5 \u00b7 IOC vs IOA vs IOF", "n": "Q2", "type": "mcq", "label": "Q2 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which indicator type is MOST appropriate for a fraud analyst investigating an abnormal wire-transfer pattern?", "opts": ["IOC", "IOA", "IOF", "Atomic indicator"], "ans": 2, "ansText": "Correct: C \u2014 Abnormal transaction patterns are fraud indicators (IOF), not technical compromise or attack indicators."}, {"part": "Part 5 \u00b7 IOC vs IOA vs IOF", "n": "Q3", "type": "tf", "label": "Q3 \u00b7 True or False", "tag": "BINARY", "q": "IOCs, IOAs, and IOFs are mutually exclusive: one intrusion can produce only one of the three types.", "ans": false, "ansText": "Answer: FALSE \u2014 One intrusion commonly produces all three: IOAs during the attack, IOCs as forensic evidence after, and IOFs if the goal involves fraudulent transactions."}, {"part": "Review Questions", "n": "Review Q1", "type": "sa", "label": "Review Q1 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "Define a threat indicator (IOC) and list three examples from different layers (network, host, email).", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q2", "type": "sa", "label": "Review Q2 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "Explain the difference between an atomic indicator and a computed indicator, with one example of each.", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q3", "type": "sa", "label": "Review Q3 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "Why is a behavioral indicator harder to automate than an atomic indicator, and what benefit does that difficulty buy the defender?", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q4", "type": "sa", "label": "Review Q4 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "Name the four stages of the IoC lifecycle in order and describe what happens at each stage.", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q5", "type": "sa", "label": "Review Q5 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "Give two reasons why a raw IP indicator alone is insufficient to drive a security decision.", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q6", "type": "sa", "label": "Review Q6 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "List four common enrichment sources and explain what context each one provides.", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q7", "type": "sa", "label": "Review Q7 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "Describe two benefits of data enrichment for a SOC analyst working through a high-volume alert queue.", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q8", "type": "sa", "label": "Review Q8 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "In the firewall-log worked example, which enrichment field had the highest impact on the decision to escalate, and why?", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q9", "type": "sa", "label": "Review Q9 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "Contrast IOC and IOA in terms of (a) timing and (b) the type of evidence each one captures.", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Review Questions", "n": "Review Q10", "type": "sa", "label": "Review Q10 \u00b7 Short Answer", "tag": "2\u20133 SENTENCES", "q": "Using the IOC time-decay formula v(t) = e^(\u2212\u03bbt) with \u03bb = 0.2/day, explain why indicators higher on the Pyramid of Pain (Week 2 connector) decay slower than atomic indicators.", "ansText": "No model answer is given in the PDF. Check the Week 5 summary notes."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 1", "type": "mcq", "label": "MCQ 1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which indicator type is a SHA-256 hash?", "opts": ["Atomic", "Computed", "Behavioral", "IOF"], "ans": 1, "ansText": "Correct: B \u2014 Computed."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 2", "type": "mcq", "label": "MCQ 2 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "In the IoC lifecycle, which stage produces refined IoCs ready for deployment?", "opts": ["Collect", "Monitor", "Analyze", "Deploy"], "ans": 2, "ansText": "Correct: C \u2014 Analyze."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 3", "type": "mcq", "label": "MCQ 3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which is NOT a common enrichment source?", "opts": ["Passive DNS", "WHOIS", "The firewall log itself", "Malware sandbox report"], "ans": 2, "ansText": "Correct: C \u2014 The raw log is the subject being enriched, not a source of context."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 4", "type": "mcq", "label": "MCQ 4 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A live PowerShell execution chain observed in EDR is best classified as:", "opts": ["IOC", "IOA", "IOF", "Atomic indicator"], "ans": 1, "ansText": "Correct: B \u2014 IOA: a live behavioral observation."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 5", "type": "mcq", "label": "MCQ 5 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "With \u03bb = 0.2/day and T = 5 days, the average validity of the indicator is approximately:", "opts": ["36.8%", "50.0%", "63.2%", "86.5%"], "ans": 2, "ansText": "Correct: C \u2014 Average validity = (1 \u2212 e^(\u2212\u03bbT)) / (\u03bbT) = (1 \u2212 e^(\u22121)) / 1 \u2248 0.632 = 63.2%. (36.8% is v(5) itself, a common trap.)"}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 1", "type": "tf", "label": "T/F 1 \u00b7 True or False", "tag": "BINARY", "q": "An IOC is forensic evidence that a breach has already occurred.", "ans": true, "ansText": "Answer: TRUE \u2014 IOCs are post-event forensic evidence."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 2", "type": "tf", "label": "T/F 2 \u00b7 True or False", "tag": "BINARY", "q": "Data enrichment can replace the need for raw indicators entirely.", "ans": false, "ansText": "Answer: FALSE \u2014 Enrichment adds context; it does not replace the indicator itself."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 3", "type": "tf", "label": "T/F 3 \u00b7 True or False", "tag": "BINARY", "q": "IOAs and IOCs can both appear in the same intrusion.", "ans": true, "ansText": "Answer: TRUE \u2014 IOAs appear during the attack and IOCs as evidence afterwards."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 4", "type": "tf", "label": "T/F 4 \u00b7 True or False", "tag": "BINARY", "q": "Behavioral indicators are less useful than atomic indicators because they are harder to automate.", "ans": false, "ansText": "Answer: FALSE \u2014 They are harder to automate but more resilient to adversary rotation, so they are higher-value."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 5", "type": "tf", "label": "T/F 5 \u00b7 True or False", "tag": "BINARY", "q": "The IoC lifecycle is strictly linear and ends at the Deploy stage.", "ans": false, "ansText": "Answer: FALSE \u2014 It is iterative; deployed detections generate new forensic clues that re-enter Collect."}];
const r=document.documentElement,s=localStorage.getItem('theme');
if(s)r.setAttribute('data-theme',s);
document.getElementById('theme').onclick=()=>{const n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);localStorage.setItem('theme',n)};
const app=document.getElementById('app'),bar=document.getElementById('bar'),timer=document.getElementById('timer');
const L='ABCD';let tick=null;
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function head(q){return `<div class="meta"><span>${esc(q.label)}</span><span>${esc(q.tag)}</span></div><div class="qt">${esc(q.q)}</div>`}
function study(){
  clearInterval(tick);timer.classList.add('hide');bar.innerHTML='';
  let h='',part='';
  D.forEach(q=>{
    if(q.part!==part){part=q.part;h+=`<h2 class="part">${esc(part)}</h2>`}
    h+=`<div class="q ${q.type}">${head(q)}`;
    if(q.type==='mcq')h+=q.opts.map((o,i)=>`<div class="opt ${i===q.ans?'right':''}"><b>${L[i]}.</b><span>${esc(o)}</span></div>`).join('');
    h+=`<div class="ans">${esc(q.ansText)}</div></div>`;
  });
  app.innerHTML=h;
}
let ex=[];
function exam(){
  clearInterval(tick);
  ex=D.filter(q=>q.type==='mcq'||q.type==='tf');bar.innerHTML='';
  let h=`<div id="result"></div>`;
  ex.forEach((q,k)=>{
    h+=`<div class="q ${q.type}" id="e${k}"><div class="meta"><span>Question ${k+1} of ${ex.length}</span><span>${q.type==='mcq'?'Multiple Choice':'True or False'}</span></div><div class="qt">${esc(q.q)}</div>`;
    const opts=q.type==='mcq'?q.opts.map((o,i)=>[i,L[i]+'. '+o]):[[1,'True'],[0,'False']];
    h+=opts.map(([v,t])=>`<label class="opt"><input type="radio" name="q${k}" value="${v}"><span>${esc(t)}</span></label>`).join('');
    h+=`<div class="ans hide"></div></div>`;
  });
  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="sub">Submit Exam</button><button class="btn" id="rst">Restart</button></div>`;
  app.innerHTML=h;
  let t=0;timer.classList.remove('hide');timer.textContent='00:00';
  tick=setInterval(()=>{t++;timer.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);
  document.getElementById('rst').onclick=exam;
  document.getElementById('sub').onclick=()=>{
    clearInterval(tick);let sc=0;
    ex.forEach((q,k)=>{
      const box=document.getElementById('e'+k);
      const c=box.querySelector('input:checked');
      const correct=q.type==='mcq'?q.ans:(q.ans?1:0);
      const val=c?+c.value:null;
      if(val===correct)sc++;
      box.querySelectorAll('label.opt').forEach(l=>{
        const v=+l.querySelector('input').value;
        if(v===correct)l.classList.add('right');
        else if(v===val)l.classList.add('wrong');
        l.querySelector('input').disabled=true;
      });
      const a=box.querySelector('.ans');a.classList.remove('hide');
      a.innerHTML=(val===null?'<b>Not answered.</b> ':val===correct?'<b>Correct.</b> ':'<b>Incorrect.</b> ')+esc(q.ansText);
    });
    const res=document.getElementById('result');
    res.style.display='block';
    res.textContent=`Score: ${sc} / ${ex.length} (${Math.round(sc/ex.length*100)}%) · Time ${timer.textContent}`;
    document.getElementById('sub').disabled=true;
    window.scrollTo({top:0,behavior:'smooth'});
  };
}
const bS=document.getElementById('bStudy'),bE=document.getElementById('bExam');
bS.onclick=()=>{bS.classList.add('on');bE.classList.remove('on');study()};
bE.onclick=()=>{bE.classList.add('on');bS.classList.remove('on');exam()};
study();
</script>
</body>
</html>
