<style>
:root{--bg:#090d16;--card:#111827;--hover:#162032;--text:#f8fafc;--muted:#94a3b8;--border:rgba(255,255,255,.1);--ok:#10b981;--bad:#f43f5e}
[data-theme="light"]{--bg:#f8fafc;--card:#fff;--hover:#f1f5f9;--text:#0f172a;--muted:#475569;--border:rgba(0,0,0,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
header{max-width:900px;margin:0 auto;padding:56px 24px 16px;position:relative}
.badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:4px 12px;border-radius:20px;background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
h1{font-size:clamp(26px,6vw,38px);font-weight:800;margin:14px 0 8px;line-height:1.2}
h1 span{background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted)}
.top{position:absolute;top:20px;right:24px;display:flex;gap:8px}
.top button,.top a{width:44px;height:44px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:18px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.modes{max-width:900px;margin:0 auto;padding:8px 24px;display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:14px;padding:10px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer}
.btn.on,.btn.primary{background:#10b981;color:#04130c;border-color:#10b981}
main{max-width:900px;margin:0 auto;padding:8px 24px 56px}
h2.part{font-family:'JetBrains Mono',monospace;font-size:13px;color:#10b981;text-transform:uppercase;letter-spacing:1px;margin:28px 0 10px}
.q{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--c,#10b981);border-radius:16px;padding:20px;margin-bottom:16px}
.mcq{--c:#3b82f6}.tf{--c:#a855f7}.sa{--c:#f59e0b}.sc{--c:#06b6d4}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:800;color:var(--c);margin-bottom:8px}
.qt{font-weight:600;margin-bottom:12px;overflow-wrap:anywhere}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--hover)}
.opt input{margin-top:5px}
.opt.right{border-color:var(--ok);background:rgba(16,185,129,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(244,63,94,.15)}
.ans{margin-top:12px;padding:12px 14px;border-left:3px solid var(--ok);background:rgba(16,185,129,.08);border-radius:8px;font-size:14px;white-space:pre-line}
#bar{max-width:900px;margin:0 auto;padding:0 24px 8px}
#result{display:none;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;font-weight:700}
.hide{display:none!important}
.timer{font-family:'JetBrains Mono',monospace;color:var(--muted);align-self:center}
footer{text-align:center;padding:24px 16px;color:var(--muted);font-size:13px;border-top:1px solid var(--border)}
@media(max-width:600px){header{padding:72px 16px 12px}.modes,main,#bar{padding-left:16px;padding-right:16px}.top{top:16px;right:16px}}
</style>

<script>
const D=[{"part": "Part 1 \u00b7 Intro to Frameworks", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which statement BEST describes a CTI framework?", "opts": ["A software product that aggregates threat feeds", "A structured methodology for collecting, analysing, and disseminating threat intelligence", "A subscription service for IOCs", "A vendor-specific threat intelligence API"], "ans": 1, "ansText": "Correct: B \u2014 A framework is a methodology; software products that operationalise it are called platforms. Common trap: students often pick A."}, {"part": "Part 1 \u00b7 Intro to Frameworks", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "'Framework' and 'platform' are interchangeable terms in CTI.", "ans": false, "ansText": "Answer: FALSE \u2014 A framework is methodology (how you think); a platform is software (what you run)."}, {"part": "Part 1 \u00b7 Intro to Frameworks", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which of the following is NOT one of the seven frameworks covered in Week 2?", "opts": ["Diamond Model", "Cyber Kill Chain", "STRIDE", "MITRE ATT&CK"], "ans": 2, "ansText": "Correct: C \u2014 STRIDE is a threat-modelling framework (Spoofing, Tampering, Repudiation, Info Disclosure, Denial of Service, Elevation of Privilege), outside Week 2's CTI scope."}, {"part": "Part 2 \u00b7 Diamond Model", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which of the following is NOT one of the four core features of a Diamond event?", "opts": ["Adversary", "Capability", "Methodology", "Victim"], "ans": 2, "ansText": "Correct: C \u2014 Methodology is a meta-feature, not a core vertex. The four core features are Adversary, Capability, Infrastructure, Victim. Common trap: mis-remembering it as a vertex."}, {"part": "Part 2 \u00b7 Diamond Model", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "The Diamond Model can be entered from any of the four vertices for analysis.", "ans": true, "ansText": "Answer: TRUE \u2014 The Diamond is symmetric: analysts can start from a known victim, capability, infrastructure, or adversary and pivot across edges to discover new features."}, {"part": "Part 2 \u00b7 Diamond Model", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Two Diamond events share the same capability and the same infrastructure but have different victims. This pattern most directly supports:", "opts": ["Patch prioritisation", "Campaign attribution", "Vulnerability scoring", "Asset inventory"], "ans": 1, "ansText": "Correct: B \u2014 Shared capability + shared infrastructure across events is the operational signature of a single campaign targeting multiple victims."}, {"part": "Part 3 \u00b7 Cyber Kill Chain", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "What is the correct order of the FIRST FOUR stages of the Cyber Kill Chain?", "opts": ["Reconnaissance \u2192 Delivery \u2192 Weaponization \u2192 Exploitation", "Weaponization \u2192 Reconnaissance \u2192 Exploitation \u2192 Delivery", "Reconnaissance \u2192 Weaponization \u2192 Delivery \u2192 Exploitation", "Delivery \u2192 Weaponization \u2192 Reconnaissance \u2192 Exploitation"], "ans": 2, "ansText": "Correct: C \u2014 Recon (gather info) \u2192 Weaponization (build payload) \u2192 Delivery (send it) \u2192 Exploitation (execute it). The weapon must be built before it can be delivered."}, {"part": "Part 3 \u00b7 Cyber Kill Chain", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "'Actions on Objectives' is the stage at which the attacker achieves their ultimate goal (e.g., data exfiltration).", "ans": true, "ansText": "Answer: TRUE \u2014 Stage 07 is the adversary's end-state: exfiltration, disruption, or destruction. Everything before it is preparation."}, {"part": "Part 3 \u00b7 Cyber Kill Chain", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A SOC blocks a phishing email at the perimeter. Which Kill Chain stage did they break?", "opts": ["Reconnaissance", "Weaponization", "Delivery", "Exploitation"], "ans": 2, "ansText": "Correct: C \u2014 Email filtering blocks the weapon DURING transmission = stage 03 (Delivery). Exploitation would only be prevented if the email reached the user but the payload failed to execute."}, {"part": "Part 4 \u00b7 MITRE ATT&CK", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "In MITRE ATT&CK, what do 'Techniques' represent?", "opts": ["The tactical objectives an adversary is trying to achieve", "The specific methods adversaries use to achieve a tactic", "The order in which an adversary progresses through an attack", "The list of vulnerabilities in a target system"], "ans": 1, "ansText": "Correct: B \u2014 Tactics = the WHY (objective); Techniques = the HOW (specific method). E.g., under tactic 'Initial Access', technique 'Phishing' is the HOW."}, {"part": "Part 4 \u00b7 MITRE ATT&CK", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "MITRE ATT&CK and the Cyber Kill Chain are the same framework under different names.", "ans": false, "ansText": "Answer: FALSE \u2014 The Kill Chain is a sequential 7-stage model (the spine); ATT&CK is a granular catalog of 14 tactics and hundreds of techniques (the muscle). They are complementary, not identical."}, {"part": "Part 4 \u00b7 MITRE ATT&CK", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "A SOC has detection rules for 'Persistence' but not for 'Privilege Escalation'. Which ATT&CK tactic IDs are we talking about?", "opts": ["TA04 and TA03", "TA05 and TA06", "TA11 and TA12", "TA13 and TA14"], "ans": 1, "ansText": "Correct: B \u2014 Persistence = TA05, Privilege Escalation = TA06."}, {"part": "Part 5 \u00b7 Pain, STIX, OSINT, CTIM", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "According to the Pyramid of Pain, which indicator type causes the adversary the MOST pain if detected?", "opts": ["IP addresses", "Domain names", "File hash values", "TTPs"], "ans": 3, "ansText": "Correct: D \u2014 TTPs sit at the top: changing them requires re-training operators, re-writing malware, and re-establishing tradecraft. Hashes sit at the bottom and can be rotated in seconds. Precision \u2260 pain."}, {"part": "Part 5 \u00b7 Pain, STIX, OSINT, CTIM", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "STIX is a software tool used to collect threat intelligence.", "ans": false, "ansText": "Answer: FALSE \u2014 STIX is a standardised LANGUAGE for representing and sharing CTI. Tools that consume/produce STIX are platforms (e.g., MISP, OpenCTI)."}, {"part": "Part 5 \u00b7 Pain, STIX, OSINT, CTIM", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "The Cyber Threat Intelligence Matrix (CTIM) classifies intelligence along which two axes?", "opts": ["Confidence level and source reliability", "Intelligence type and attack lifecycle stage", "Indicator complexity and detection cost", "Adversary motivation and tool sophistication"], "ans": 1, "ansText": "Correct: B \u2014 CTIM is a 2D matrix: X-axis = intelligence type (strategic/operational/tactical/technical), Y-axis = attack lifecycle stage (pre-attack \u2192 exfil/impact)."}, {"part": "Part 6 \u00b7 CTI Platforms", "n": "Q1", "type": "mcq", "label": "Q1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which of the following is an OPEN-SOURCE CTI platform?", "opts": ["Anomali", "Recorded Future", "MISP", "ThreatConnect"], "ans": 2, "ansText": "Correct: C \u2014 MISP is open-source and self-hostable; the others are commercial. Common trap: a free community tier of a commercial product is not open-source."}, {"part": "Part 6 \u00b7 CTI Platforms", "n": "Q2", "type": "tf", "label": "Q2 \u00b7 True or False", "tag": "BINARY", "q": "A CTI platform can replace the need for analysts to understand frameworks.", "ans": false, "ansText": "Answer: FALSE \u2014 A platform operationalises frameworks; it does not replace the analyst's need to understand them. Without framework fluency, the analyst cannot interpret, prioritise, or act on its outputs."}, {"part": "Part 6 \u00b7 CTI Platforms", "n": "Q3", "type": "mcq", "label": "Q3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "What is the role of STIX/TAXII in the platform-to-SIEM relationship?", "opts": ["STIX/TAXII is the GUI used by SOC analysts", "STIX is the language; TAXII is the transport protocol that carries CTI from platform to SIEM", "STIX/TAXII replaces the SIEM entirely", "STIX/TAXII is a feed of IOCs sold by commercial vendors"], "ans": 1, "ansText": "Correct: B \u2014 STIX = structured language; TAXII = trusted transport protocol. Together they let a platform push enriched indicators into a SIEM in a standardised, machine-readable way."}, {"part": "Applied Scenarios", "n": "Scenario 01", "type": "sc", "label": "Scenario 01", "tag": "KILL CHAIN \u00b7 ATTACKER SUCCESS", "q": "A SOC's controls have only a 20% chance of detecting and stopping an attacker at each of the 7 Kill Chain stages. What is the probability an attacker completes all 7 stages?", "ansText": "P(stop at one stage) = 0.20, so P(pass one stage) = 0.80.\nP(pass all 7) = 0.80^7 = 0.2097 \u2248 20.97%.\n\nImplication: even though the SOC stops 1 in 5 attackers at EACH stage, ~21% still complete the full chain. This is the case for defense-in-depth: either raise per-stage detection or add detection where coverage is zero."}, {"part": "Applied Scenarios", "n": "Scenario 02", "type": "sc", "label": "Scenario 02", "tag": "ATT&CK \u00b7 TACTIC COVERAGE", "q": "A SOC has detection mapped to 11 of the 14 MITRE ATT&CK Enterprise tactics. Calculate coverage and the additional tactics needed for 100%.", "ansText": "Coverage = (11 / 14) \u00d7 100% = 78.57%.\nAdditional tactics for 100% = 14 \u2212 11 = 3.\nLikely missing: TA01 Reconnaissance, TA02 Resource Development, TA13 Exfiltration, TA14 Impact (any 3 of these 4).\n\nDiscussion: Recon and Resource Development are pre-compromise and hard to detect internally; cover them via CTI platform feeds. Exfiltration and Impact are post-compromise but high-cost; prioritise them for native SIEM detection, with TA13/TA14 first."}, {"part": "Applied Scenarios", "n": "Scenario 03", "type": "sc", "label": "Scenario 03", "tag": "KILL CHAIN \u00b7 TARGETED INVESTMENT", "q": "Each of 7 stages has a 25% detection chance. (a) Find the probability an attacker completes all 7. (b) If detection improves to 40% at exactly two stages, recalculate and give the percentage reduction in attacker success.", "ansText": "(a) P(pass one) = 0.75; P(all 7) = 0.75^7 = 0.1335 \u2248 13.35%.\n(b) 2 stages: P(pass) = 0.60; 5 stages: P(pass) = 0.75.\nNew P(all 7) = 0.60^2 \u00d7 0.75^5 = 0.36 \u00d7 0.2373 = 0.0854 \u2248 8.54%.\nReduction = (13.35% \u2212 8.54%) / 13.35% = 36.0% relative reduction.\n\nImplication: improving just 2 of 7 stages cuts attacker success by more than a third. Targeted investment at chokepoint stages (e.g., Delivery + C2) beats spreading the budget evenly."}, {"part": "Applied Scenarios", "n": "Scenario 04", "type": "sc", "label": "Scenario 04", "tag": "ATT&CK \u00b7 COVERAGE TARGET", "q": "A SOC maps detection rules to 9 of the 14 ATT&CK tactics. Calculate current coverage, how many more tactics are needed for an 85% target, and how to justify it to leadership.", "ansText": "Current coverage = (9 / 14) \u00d7 100% = 64.29%.\n85% of 14 = 11.9 tactics, rounded UP to 12.\nAdditional tactics to map = 12 \u2212 9 = 3.\n\nJustification: 85% is an interim milestone, not a finish line. It shows the SOC maturing from ad-hoc detection (rules clustered around initial access/execution) toward a balanced cross-kill-chain posture. The remaining ~2 tactics are the hardest to detect and need extra telemetry (network sensors, deception) budgeted for the next fiscal year."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q1", "type": "sa", "label": "Review Q1 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Name the four core features of a Diamond event and explain why they are edge-connected.", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q2", "type": "sa", "label": "Review Q2 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "List the seven stages of the Cyber Kill Chain in order.", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q3", "type": "sa", "label": "Review Q3 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "What is the difference between a tactic and a technique in MITRE ATT&CK?", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q4", "type": "sa", "label": "Review Q4 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Name all 14 MITRE ATT&CK Enterprise tactics.", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q5", "type": "sa", "label": "Review Q5 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Why does the Pyramid of Pain place TTPs at the top and hash values at the bottom?", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q6", "type": "sa", "label": "Review Q6 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "What are the five core components of STIX?", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q7", "type": "sa", "label": "Review Q7 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Name six common OSINT tools and one use case for each.", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q8", "type": "sa", "label": "Review Q8 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "What are the two axes of the Cyber Threat Intelligence Matrix (CTIM)?", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q9", "type": "sa", "label": "Review Q9 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "Differentiate a CTI framework from a CTI platform, with one example of each.", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 Review Questions", "n": "Review Q10", "type": "sa", "label": "Review Q10 \u00b7 Short Answer", "tag": "OPEN-ENDED", "q": "How would you map a phishing-based compromise onto BOTH the Diamond Model and the Cyber Kill Chain simultaneously?", "ansText": "No model answer is given in the PDF (answers are discussed in tutorial). Check the Week 2 summary notes."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 1", "type": "mcq", "label": "MCQ 1 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which model arranges intrusion features into 4 edge-connected vertices?", "opts": ["Kill Chain", "Diamond Model", "ATT&CK", "CTIM"], "ans": 1, "ansText": "Correct: B \u2014 The Diamond Model has four edge-connected vertices."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 2", "type": "mcq", "label": "MCQ 2 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "How many tactics are in the MITRE ATT&CK Enterprise matrix (current canonical version, per the course)?", "opts": ["7", "11", "14", "18"], "ans": 2, "ansText": "Correct: C \u2014 The course uses 14 Enterprise tactics."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 3", "type": "mcq", "label": "MCQ 3 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "STIX is best described as a:", "opts": ["commercial CTI platform", "SIEM", "standardised language for sharing CTI", "feed aggregator"], "ans": 2, "ansText": "Correct: C \u2014 STIX is a standardised language, not a tool."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 4", "type": "mcq", "label": "MCQ 4 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "Which is an OPEN-SOURCE CTI platform?", "opts": ["Recorded Future", "Anomali", "MISP", "ThreatConnect"], "ans": 2, "ansText": "Correct: C \u2014 MISP is open-source."}, {"part": "Cumulative \u00b7 MCQ", "n": "MCQ 5", "type": "mcq", "label": "MCQ 5 \u00b7 Multiple Choice (MCQ)", "tag": "SINGLE ANSWER", "q": "In the Pyramid of Pain, which indicator sits at the BOTTOM (easiest for the adversary to change)?", "opts": ["TTPs", "Tools", "Domain names", "Hash values"], "ans": 3, "ansText": "Correct: D \u2014 Hash values are trivially changed."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 1", "type": "tf", "label": "T/F 1 \u00b7 True or False", "tag": "BINARY", "q": "The Cyber Kill Chain is a linear model with exactly 7 stages.", "ans": true, "ansText": "Answer: TRUE \u2014 It is a sequential 7-stage model."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 2", "type": "tf", "label": "T/F 2 \u00b7 True or False", "tag": "BINARY", "q": "MITRE ATT&CK tactics represent the HOW of an attack, while techniques represent the WHY.", "ans": false, "ansText": "Answer: FALSE \u2014 Reversed: tactics = WHY, techniques = HOW."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 3", "type": "tf", "label": "T/F 3 \u00b7 True or False", "tag": "BINARY", "q": "MISP is an open-source CTI platform.", "ans": true, "ansText": "Answer: TRUE \u2014 MISP is open-source and self-hostable."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 4", "type": "tf", "label": "T/F 4 \u00b7 True or False", "tag": "BINARY", "q": "CTIM classifies intelligence along two axes: intelligence type and attack lifecycle stage.", "ans": true, "ansText": "Answer: TRUE \u2014 X-axis = intelligence type; Y-axis = attack lifecycle stage."}, {"part": "Cumulative \u00b7 True / False", "n": "T/F 5", "type": "tf", "label": "T/F 5 \u00b7 True or False", "tag": "BINARY", "q": "Covering all 14 ATT&CK tactics with one detection rule each is stronger than covering 8 tactics deeply.", "ans": false, "ansText": "Answer: FALSE \u2014 Depth vs breadth: one shallow rule per tactic is not stronger than deep coverage."}];
const r=document.documentElement,s=localStorage.getItem('theme');
if(s)r.setAttribute('data-theme',s);
document.getElementById('theme').onclick=()=>{const n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);localStorage.setItem('theme',n)};
const app=document.getElementById('app'),bar=document.getElementById('bar'),timer=document.getElementById('timer');
const L='ABCD';let tick=null;
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function head(q){return `<div class="meta"><span>${esc(q.label)}</span><span>${esc(q.tag)}</span></div><div class="qt">${esc(q.q)}</div>`}
function study(){
  clearInterval(tick);timer.classList.add('hide');bar.innerHTML='';
  let h='',part='';
  D.forEach(q=>{
    if(q.part!==part){part=q.part;h+=`<h2 class="part">${esc(part)}</h2>`}
    h+=`<div class="q ${q.type}">${head(q)}`;
    if(q.type==='mcq')h+=q.opts.map((o,i)=>`<div class="opt ${i===q.ans?'right':''}"><b>${L[i]}.</b><span>${esc(o)}</span></div>`).join('');
    h+=`<div class="ans">${esc(q.ansText)}</div></div>`;
  });
  app.innerHTML=h;
}
let ex=[];
function exam(){
  clearInterval(tick);
  ex=D.filter(q=>q.type==='mcq'||q.type==='tf');bar.innerHTML='';
  let h=`<div id="result"></div>`;
  ex.forEach((q,k)=>{
    h+=`<div class="q ${q.type}" id="e${k}"><div class="meta"><span>Question ${k+1} of ${ex.length}</span><span>${q.type==='mcq'?'Multiple Choice':'True or False'}</span></div><div class="qt">${esc(q.q)}</div>`;
    const opts=q.type==='mcq'?q.opts.map((o,i)=>[i,L[i]+'. '+o]):[[1,'True'],[0,'False']];
    h+=opts.map(([v,t])=>`<label class="opt"><input type="radio" name="q${k}" value="${v}"><span>${esc(t)}</span></label>`).join('');
    h+=`<div class="ans hide"></div></div>`;
  });
  h+=`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="sub">Submit Exam</button><button class="btn" id="rst">Restart</button></div>`;
  app.innerHTML=h;
  let t=0;timer.classList.remove('hide');timer.textContent='00:00';
  tick=setInterval(()=>{t++;timer.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);
  document.getElementById('rst').onclick=exam;
  document.getElementById('sub').onclick=()=>{
    clearInterval(tick);let sc=0;
    ex.forEach((q,k)=>{
      const box=document.getElementById('e'+k);
      const c=box.querySelector('input:checked');
      const correct=q.type==='mcq'?q.ans:(q.ans?1:0);
      const val=c?+c.value:null;
      if(val===correct)sc++;
      box.querySelectorAll('label.opt').forEach(l=>{
        const v=+l.querySelector('input').value;
        if(v===correct)l.classList.add('right');
        else if(v===val)l.classList.add('wrong');
        l.querySelector('input').disabled=true;
      });
      const a=box.querySelector('.ans');a.classList.remove('hide');
      a.innerHTML=(val===null?'<b>Not answered.</b> ':val===correct?'<b>Correct.</b> ':'<b>Incorrect.</b> ')+esc(q.ansText);
    });
    const res=document.getElementById('result');
    res.style.display='block';
    res.textContent=`Score: ${sc} / ${ex.length} (${Math.round(sc/ex.length*100)}%) · Time ${timer.textContent}`;
    document.getElementById('sub').disabled=true;
    window.scrollTo({top:0,behavior:'smooth'});
  };
}
const bS=document.getElementById('bStudy'),bE=document.getElementById('bExam');
bS.onclick=()=>{bS.classList.add('on');bE.classList.remove('on');study()};
bE.onclick=()=>{bE.classList.add('on');bS.classList.remove('on');exam()};
study();
</script>
